# ---------------------------------------------------------------------------
# Haunted Honeypot — Docker Compose service definitions
#
# Usage:  docker compose -f deploy/docker-compose.yml up -d
#         (or symlink / copy to workspace root and use `docker compose up -d`)
#
# Start from the repository root so the build context resolves correctly:
#   docker compose -f deploy/docker-compose.yml build
# ---------------------------------------------------------------------------

services:

  # -------------------------------------------------------------------------
  # trap — fake SSH server (The Trap + Ghost Shell)
  # -------------------------------------------------------------------------
  trap:
    build:
      context: ..
      dockerfile: trap/Dockerfile
    image: haunted-trap:latest
    restart: unless-stopped

    # Harden the container: read-only root filesystem, no capabilities,
    # tmpfs for writable paths the runtime actually needs.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=0755

    # Drop every Linux capability. The trap only needs network I/O on a
    # non-privileged port; no capabilities are required for that.
    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    # Hard resource limits so a runaway session cannot exhaust the host.
    mem_limit: 256m
    cpus: "0.5"

    # Persist the SSH host key across restarts and collect session logs.
    volumes:
      - trap_keys:/data/keys
      - trap_logs:/data/logs

    # Port mapping: the public SSH port 22 goes straight to the trap.
    # The real admin sshd listens on a separate hidden port (see docs), so
    # port 22 is free on the host. Docker's DNAT keeps the attacker's real IP.
    ports:
      - "${TRAP_PUBLIC_PORT:-22}:2222"

    # All secrets and tunable parameters come from a .env file.
    # Copy .env.example → .env and fill in values before first run.
    env_file:
      - ../.env

    # Sensible defaults that the .env file can override.
    environment:
      TRAP_PORT: "2222"
      TRAP_HOST_KEY_PATH: "/data/keys/host_ed25519"
      TRAP_LOG_DIR: "/data/logs"
      TRAP_CREDENTIAL_FILE: "/app/trap/credentials_default.txt"
      TRAP_IDLE_TIMEOUT_SECONDS: "300"
      TRAP_MAX_SESSION_SECONDS: "1800"
      # TRAP_LLM_BACKEND is deliberately NOT set here: values in this block
      # override env_file, so it would silently ignore the .env choice.
      # The trap defaults to "scripted" when .env does not set it.
      # TRAP_LLM_API_URL and TRAP_LLM_API_KEY are set in .env only.
      # TRAP_ACCEPT_AFTER_ATTEMPTS is optional; leave unset to disable.

    # The trap has no need to reach the brain or dashboard directly;
    # it writes per-session log files to the shared volume and that is the
    # only handoff point. Network isolation is intentional.
    networks:
      - trap_net

  # -------------------------------------------------------------------------
  # brain — API, analyzer and note generator (The Brain)
  # -------------------------------------------------------------------------
  brain:
    build:
      context: ..
      dockerfile: brain/Dockerfile
    image: haunted-brain:latest
    restart: unless-stopped

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=0755

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m
    cpus: "1.0"

    # Session logs are mounted READ-ONLY. The database lives on its own
    # volume, which the trap service never mounts.
    volumes:
      - trap_logs:/data/logs:ro
      - brain_db:/data/db

    # BRAIN_API_TOKEN, BRAIN_LLM_API_KEY and BRAIN_LLM_MODEL come from .env.
    env_file:
      - ../.env

    environment:
      BRAIN_LOG_DIR: "/data/logs"
      BRAIN_DATABASE_PATH: "/data/db/brain.db"

    # Brain is not on trap_net, so the internet-facing trap cannot reach it.
    networks:
      - brain_net

  # -------------------------------------------------------------------------
  # dashboard — static build output of the React app (no published ports)
  # -------------------------------------------------------------------------
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    image: haunted-dashboard:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Docker copies the image's /srv into this empty named volume on first
    # creation; caddy mounts the same volume read-only. After rebuilding the
    # dashboard image, run `docker compose down` and
    # `docker volume rm <project>_dashboard_dist` to publish the new build.
    volumes:
      - dashboard_dist:/srv
    networks:
      - web_net

  # -------------------------------------------------------------------------
  # caddy — HTTPS reverse proxy and static file server (only public web entry)
  # -------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Empty or unset DOMAIN makes the Caddyfile fall back to plain HTTP on :80.
      DOMAIN: "${DOMAIN:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dashboard_dist:/srv:ro
      # Certificates and ACME account data survive restarts.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
    # web_net for the dashboard side, brain_net to reach brain:8000.
    # The trap is on neither network.
    networks:
      - web_net
      - brain_net

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  # Built dashboard files, shared between dashboard (rw) and caddy (ro).
  dashboard_dist:
    driver: local
  # Caddy certificate and ACME data.
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  trap_keys:
    driver: local
  trap_logs:
    driver: local
  # Brain database only; never mounted by the trap service.
  brain_db:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  trap_net:
    driver: bridge
  # Brain-side network; the trap service is NOT attached.
  brain_net:
    driver: bridge
  # Dashboard-side network; the trap service is NOT attached.
  web_net:
    driver: bridge

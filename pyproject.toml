[project]
name = "haunted-honeypot-trap"
version = "0.1.0"
description = "Haunted Honeypot — fake SSH server and Ghost Shell (The Trap)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Haunted Honeypot" }]

dependencies = [
    "asyncssh==2.24.0",
    "aiofiles==24.1.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
   
    "hypothesis",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "bandit[toml]",
    "types-aiofiles",
    "types-PyYAML",
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trap*"]

# ---------------------------------------------------------------------------
# Ruff — linter and formatter, targeting Python 3.12
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations (type hints)
]
ignore = [
    "ANN101",  # missing type annotation for 'self'
    "ANN102",  # missing type annotation for 'cls'
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]  # relax security and annotation rules in tests

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["asyncssh.*", "yaml"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Bandit — security scan
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["trap/"]
skips = []

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

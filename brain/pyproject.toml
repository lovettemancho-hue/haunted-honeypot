[project]
name = "haunted-honeypot-brain"
version = "0.1.0"
description = "Haunted Honeypot - API, analyzer and note generator (The Brain)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Haunted Honeypot" }]

# Gemini is called through plain httpx (no extra SDK).
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "bandit[toml]",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# The `brain` package is the directory that contains this file.
[tool.setuptools]
packages = [
    "brain",
    "brain.ingest",
    "brain.analysis",
    "brain.notes",
    "brain.containment",
    "brain.api",
]

[tool.setuptools.package-dir]
brain = "."

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.bandit]
skips = []
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
